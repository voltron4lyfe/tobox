# `docker compose up -d` runs the published image (ghcr.io); `make up` builds it from source.
# TOBOX_TAG picks a release (default: latest), TOBOX_PORT the host port (default: 8080).
# Put overrides in a .env file next to this one; see README "Run it" for the variables.
services:
  tobox:
    image: ${TOBOX_IMAGE:-ghcr.io/chriscla/tobox}:${TOBOX_TAG:-latest}
    build: .
    restart: unless-stopped
    ports:
      - "${TOBOX_PORT:-8080}:8000"
    environment:
      # The URL you open Tobox at (AI-agent OAuth and notification links use it).
      TOBOX_PUBLIC_URL: ${TOBOX_PUBLIC_URL:-http://localhost:8080}
      # Needed to approve AI agents from other machines. Set it if Tobox is on a network.
      TOBOX_OWNER_PASSWORD: ${TOBOX_OWNER_PASSWORD:-}
    volumes:
      - tobox-data:/data

volumes:
  tobox-data:
